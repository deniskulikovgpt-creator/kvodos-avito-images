name: Import correct Avito images
on:
  push:
    paths:
      - 'archives/*.zip'
      - '.github/workflows/import-correct-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract image archives
        run: |
          shopt -s nullglob
          for archive in archives/*.zip; do
            echo "Extracting $archive"
            unzip -o "$archive" -d .
          done
      - name: Commit extracted JPG images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avito/bankruptcy/*/*.jpg
          git diff --cached --quiet || git commit -m 'Replace Avito images with approved versions'
          git push
