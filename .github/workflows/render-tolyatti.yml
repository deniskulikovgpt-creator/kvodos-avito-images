name: Render Tolyatti PNGs
on:
  push:
    paths:
      - 'source/tolyatti/*.svg'
      - '.github/workflows/render-tolyatti.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cairosvg
      - name: Render PNG files
        run: |
          mkdir -p avito/bankruptcy/tolyatti
          python - <<'PY'
          import cairosvg, glob, os
          for src in sorted(glob.glob('source/tolyatti/tolyatti_*.svg')):
              name=os.path.splitext(os.path.basename(src))[0]+'.png'
              out=os.path.join('avito/bankruptcy/tolyatti',name)
              cairosvg.svg2png(url=src,write_to=out,output_width=1920,output_height=1440)
              print(out)
          PY
      - name: Commit PNG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avito/bankruptcy/tolyatti/*.png
          git diff --cached --quiet || git commit -m 'Render Tolyatti PNG images'
          git push
