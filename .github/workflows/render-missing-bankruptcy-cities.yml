name: Render missing bankruptcy city images
on:
  push:
    paths:
      - 'tools/render_missing_bankruptcy_cities.py'
      - '.github/workflows/render-missing-bankruptcy-cities.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Render city images
        run: python tools/render_missing_bankruptcy_cities.py
      - name: Commit rendered PNG files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add avito/bankruptcy/saratov/*.png avito/bankruptcy/novosibirsk/*.png avito/bankruptcy/ekaterinburg/*.png avito/bankruptcy/omsk/*.png avito/bankruptcy/belgorod/*.png
          git diff --cached --quiet || git commit -m 'Render missing bankruptcy city images'
          git push
